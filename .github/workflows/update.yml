   name: Update yields
   on:
     schedule:
       - cron: "30 21 * * *"
       - cron: "30 22 * * *"
     workflow_dispatch:
   permissions:
     contents: write
   jobs:
     update:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-python@v5
           with:
             python-version: "3.12"
         - name: Fetch yields from FRED
           run: python fetch_yields.py
           env:
             FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
         - name: Commit if changed
           run: |
             git config user.name "github-actions"
             git config user.email "actions@users.noreply.github.com"
             git add data/yields.csv
             git diff --cached --quiet || (git commit -m "Update yields" && git push)
