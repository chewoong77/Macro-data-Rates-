name: Update data
on:
  schedule:
    - cron: "30 21 * * *"   # 06:30 KST (데이터만)
    - cron: "30 22 * * *"   # 07:30 KST (데이터 + Claude 분석)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch yields and WTI from FRED
        run: python fetch_yields.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Claude analysis
        if: github.event.schedule != '30 21 * * *'
        continue-on-error: true
        run: python analyze.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update data" && git push)
